[project]
name = "alarm-protocol"
version = "0.1.0"
description = "Reference codec for alarm protocol v1"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "pyyaml>=6"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alarm_protocol"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
