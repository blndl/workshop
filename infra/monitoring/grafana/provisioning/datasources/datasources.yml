apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData: {timeInterval: 5s}
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: grafana_ro                      # read-only role (infra/docker/postgres/readonly.sql)
    jsonData: {database: alarm, sslmode: disable, postgresVersion: 1700}
    secureJsonData: {password: grafana-ro-dev}
