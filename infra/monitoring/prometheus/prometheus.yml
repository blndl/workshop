# Prometheus: scrapes metrics from the box's services every few seconds.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: alarm-api          # alarm state, modules, events, database queue (services/api/alarm_api/metrics.py)
    scrape_interval: 5s
    static_configs: [{targets: ["api:8000"]}]
  - job_name: node               # the box itself: CPU, memory, disk
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: cadvisor           # each container: CPU, memory, restarts
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
