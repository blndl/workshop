# The whole alarm system. Run from the repo root (scripts/sim.sh wraps these):
#
#   docker compose -f infra/docker/compose.yml up -d                    # broker + ntfy only (services run on your machine)
#   docker compose -f infra/docker/compose.yml --profile hub up -d      # "the box": + alarm-core, api, camera, notifier
#   ... --profile hub --profile sim up -d                               # + a simulated ESP, no hardware needed
#   ... --profile monitoring                                            # + Prometheus, Grafana, Loki (infra/monitoring)
#
# Networks mirror a real home:
#   iot   the house Wi-Fi: sensor nodes and the broker, nothing else
#   core  inside the box: broker and the services
# The broker is the only thing on both. scripts/sim.sh probe checks that.

name: alarm

x-service: &service
  image: alarm
  build:
    context: ../..
    dockerfile: infra/docker/Dockerfile
  restart: unless-stopped
  # Run as the host user who owns .secrets/ and data/ (scripts/sim.sh sets these),
  # so the mounted files are readable on Linux hosts and CI, not just on macOS.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  volumes:
    - ../../.secrets:/app/.secrets:ro
    - ../../data:/app/data
  depends_on: [mosquitto]

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # 127.0.0.1 by default; MQTT_BIND=0.0.0.0 lets real ESPs on the LAN connect.
      - "${MQTT_BIND:-127.0.0.1}:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ../../.secrets/mosquitto:/mosquitto/secrets:ro
    networks: [iot, core]
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alarm}
      POSTGRES_USER: ${POSTGRES_USER:-alarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alarm-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./postgres/readonly.sql:/docker-entrypoint-initdb.d/readonly.sql:ro   # Grafana's read-only role
    healthcheck:   # "ready" only once it accepts connections, not just started
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [core]
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy
    command: serve
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8080}
    ports:
      - "8080:80"   # all interfaces, so a phone on the same network can reach it
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro
      - ntfy-auth:/var/lib/ntfy
      - ntfy-cache:/var/cache/ntfy
    networks: [core]
    restart: unless-stopped

  # --- the box (profile: hub) ---------------------------------------------------

  alarm-core:
    <<: *service
    profiles: [hub]
    command: [python, -m, alarm_core, --broker, "mosquitto:1883", run,
              --exit-delay, "${EXIT_DELAY:-30}", --entry-delay, "${ENTRY_DELAY:-30}"]
    networks: [core]

  api:
    <<: *service
    profiles: [hub]
    command: [python, -m, alarm_api, --broker, "mosquitto:1883", --host, 0.0.0.0]
    environment:
      ALARM_SIM: ${ALARM_SIM:-0}   # 1 = show the simulator panel (dev only)
      DATABASE_URL: postgresql://${POSTGRES_USER:-alarm}:${POSTGRES_PASSWORD:-alarm-dev-password}@postgres:5432/${POSTGRES_DB:-alarm}
      GRAFANA_URL: ${GRAFANA_URL:-}   # as seen by the browser; set by sim.sh when monitoring runs (Metrics tab)
    depends_on:
      mosquitto: {condition: service_started}
      postgres: {condition: service_healthy}   # start only once the database accepts connections
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"   # localhost only until login (task D2) exists
    networks: [core]

  camera:
    <<: *service
    profiles: [hub]
    # Docker on macOS can't reach the webcam: generated frames by default.
    # On a Linux host with a webcam: CAMERA_SOURCE=--device=0 and uncomment devices.
    command: [python, -m, alarm_camera, --broker, "mosquitto:1883", "${CAMERA_SOURCE:---fake}", run]
    # devices: ["/dev/video0:/dev/video0"]
    networks: [core]

  notifier:
    <<: *service
    profiles: [hub]
    command: [python, -m, alarm_notifier, --broker, "mosquitto:1883", --ntfy-url, "http://ntfy:80", run]
    depends_on: [mosquitto, ntfy]
    networks: [core]

  # --- simulated hardware (profile: sim) ----------------------------------------

  door-1:
    <<: *service
    profiles: [sim]
    command: [python, -m, alarm_sim, --broker, "mosquitto:1883", node, --node, door-1, --headless]
    networks: [iot]

  # Segmentation check: a device on the house Wi-Fi tries to reach everything.
  probe:
    <<: *service
    profiles: [probe]
    restart: "no"
    command: [python, -m, alarm_sim.probe]
    networks: [iot]

  # --- monitoring (profile: monitoring) -----------------------------------------
  # Configs in infra/monitoring/. Only Grafana is published, on localhost.

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: [monitoring]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [core]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # sim.sh passes the one from .secrets/dev.json
      # Read-only viewing without a login, and embeddable in the dashboard's Metrics tab.
      # Fine on localhost; revisit with the dashboard login (task D2).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/alarm.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki, postgres]
    networks: [core]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    profiles: [monitoring]
    volumes:
      - loki-data:/loki
    networks: [core]
    restart: unless-stopped

  alloy:   # ships container logs to Loki (duress lines dropped)
    image: grafana/alloy:v1.20.1
    profiles: [monitoring]
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    volumes:
      - ../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read access to the Docker API: powerful (it can see every container). Monitoring only.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [core]
    restart: unless-stopped

  node-exporter:   # the box: CPU, memory, disk
    image: prom/node-exporter:v1.12.1
    profiles: [monitoring]
    command: [--path.rootfs=/host]
    volumes:
      - /:/host:ro
    pid: host
    networks: [core]
    restart: unless-stopped

  cadvisor:   # per-container CPU and memory
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    profiles: [monitoring]
    privileged: true
    devices: [/dev/kmsg]
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # container names
      - /run/containerd:/run/containerd:ro             # cAdvisor's Docker support goes through containerd
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [core]
    restart: unless-stopped

networks:
  iot:
  core:

volumes:
  ntfy-auth:
  ntfy-cache:
  prometheus-data:
  grafana-data:
  loki-data:
  postgres-data:
