name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e 'protocol/python[mqtt,dev]' -e 'simulator[dev]' -e 'services/alarm-core[dev]' -e 'services/camera[dev]' -e 'services/notifier[dev]'
      - name: Protocol tests
        run: pytest -q protocol/python
      - name: Test vectors are up to date
        run: |
          cd protocol/python && python gen_vectors.py
          git diff --exit-code ../test-vectors.json
      - name: Simulator tests
        run: pytest -q simulator
      - name: Scenarios
        run: python -m alarm_sim selftest
      - name: alarm-core tests
        run: pytest -q services/alarm-core
      - name: camera tests
        run: pytest -q services/camera
      - name: notifier tests
        run: pytest -q services/notifier
