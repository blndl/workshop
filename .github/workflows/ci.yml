name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e 'protocol/python[mqtt,dev]' -e 'simulator[dev]' -e 'services/alarm-core[dev]' -e 'services/camera[dev]' -e 'services/notifier[dev]' -e 'services/api[dev]'
      - name: Protocol tests
        run: pytest -q protocol/python
      - name: Test vectors are up to date
        run: |
          cd protocol/python && python gen_vectors.py
          git diff --exit-code ../test-vectors.json
      - name: Simulator tests
        run: pytest -q simulator
      - name: Scenarios
        run: python -m alarm_sim selftest
      - name: alarm-core tests
        run: pytest -q services/alarm-core
      - name: camera tests
        run: pytest -q services/camera
      - name: notifier tests
        run: pytest -q services/notifier
      - name: api tests
        run: pytest -q services/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build   # includes the TypeScript check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secrets for the test stack
        run: scripts/dev-secrets.sh
      - name: Build and start the box + simulated ESP
        run: scripts/sim.sh up
      - name: alarm-core sees the node
        run: |
          for i in $(seq 30); do
            scripts/sim.sh status | grep -q '"online": true' && exit 0
            sleep 2
          done
          exit 1
      - name: Arm through the API
        run: |
          curl -sf -X POST -H 'content-type: application/json' -d '{"code":"1234"}' localhost:8000/api/arm
      - name: Network segmentation
        run: scripts/sim.sh probe
      - name: Logs on failure
        if: failure()
        run: docker compose -f infra/docker/compose.yml --profile hub --profile sim logs
