[project]
name = "alarm-notifier"
version = "0.1.0"
description = "Phone alerts for the alarm, through ntfy"
requires-python = ">=3.11"
dependencies = ["alarm-protocol[mqtt]"]

[project.optional-dependencies]
dev = ["pytest", "alarm-core", "alarm-camera", "alarm-sim"]

[project.scripts]
alarm-notifier = "alarm_notifier.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alarm_notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
