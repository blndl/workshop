[project]
name = "alarm-api"
version = "0.1.0"
description = "Web API for the alarm"
requires-python = ">=3.11"
dependencies = ["alarm-protocol[mqtt]", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "httpx", "alarm-core", "alarm-sim"]

[project.scripts]
alarm-api = "alarm_api.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alarm_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
