[project]
name = "alarm-core"
version = "0.1.0"
description = "Alarm state machine for the Pi"
requires-python = ">=3.11"
dependencies = ["alarm-protocol[mqtt]"]

[project.optional-dependencies]
dev = ["pytest", "alarm-sim"]

[project.scripts]
alarm-core = "alarm_core.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["alarm_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
